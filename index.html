<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einen Satz bauen – Kleidung</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f7fb; --card:#ffffff; --ink:#1f2a44; --muted:#6b7893; --line:#e3e9f2;
  --der:#2f6fe4; --die:#e0449a; --das:#1fa463;
  --ort:#6b4fd8; --verb:#e5533d; --obj:#0e8f9c; --slate:#475069;
  --ok:#1fa463; --no:#d6455d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 500px at 10% -10%, #e6efff 0%, transparent 60%),
    radial-gradient(800px 500px at 100% 110%, #f3e9ff 0%, transparent 60%),
    var(--bg);
  min-height:100vh;
  line-height:1.45;
}
.app{max-width:920px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:600;font-size:1.15rem}
.tools{display:flex;gap:8px}
.tool{
  width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);
  display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:background .15s,border-color .15s,color .15s;
}
.tool:hover{border-color:#c7d3e8}
.tool svg{width:24px;height:24px}
.tool[aria-pressed="false"]{color:#a3adc2;background:#eef2f8}
.tool[aria-pressed="false"] .slash{display:block}
.tool .slash{display:none}
:focus-visible{outline:3px solid #8fb4ff;outline-offset:2px}

.dots{display:flex;gap:6px;align-items:center;margin-bottom:14px}
.dot{height:10px;flex:1;border-radius:99px;background:#dde5f1;border:0;padding:0;cursor:default}
.dot.open{cursor:pointer}
.dot.open:hover{filter:brightness(.92)}
.chip[data-go]{cursor:pointer}
.chip[data-go]:hover{filter:brightness(.95);transform:translateY(-1px)}
.stage.in-r{animation:inr .28s ease-out}
.stage.in-l{animation:inl .28s ease-out}
@keyframes inr{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.keys{color:var(--muted);font-size:.9rem;text-align:center;margin-top:12px}
.dot.done{background:var(--ort)}
.dot.now{background:var(--verb)}

.stripwrap{
  background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px 16px 12px;margin-bottom:14px;
  display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
}
.strip{display:flex;flex-wrap:wrap;gap:10px 8px;align-items:flex-start;min-height:62px}
.cw{display:flex;flex-direction:column;align-items:center;gap:3px}
.chip{
  font-size:1.25rem;font-weight:500;padding:6px 12px;border-radius:12px;border:2px solid;white-space:nowrap;background:#fff;
}
.chip.ort{color:var(--ort);border-color:var(--ort);background:#f1edff}
.chip.verb{color:var(--verb);border-color:var(--verb);background:#fff0ed}
.chip.obj{color:var(--obj);border-color:var(--obj);background:#e8f8fa}
.chip.sub{color:var(--slate);border-color:#d5dcea;background:#f6f8fc}
.chip.gap{color:#a3adc2;border-style:dashed;border-color:#cdd6e6;background:transparent}
.pos{font-size:.72rem;color:var(--muted)}
.hear{
  flex:none;border:0;background:#eef3ff;color:var(--der);border-radius:12px;padding:9px 12px;font:inherit;font-weight:500;cursor:pointer;display:flex;gap:6px;align-items:center
}
.hear:disabled{opacity:.4;cursor:default}
.hear svg{width:18px;height:18px}

.stage{
  background:var(--card);border-radius:28px;padding:30px 28px 26px;
  box-shadow:0 12px 40px rgba(40,60,110,.09);min-height:380px;display:flex;flex-direction:column;
}
.stage h1{font-size:2rem;margin:0 0 4px;font-weight:600;line-height:1.15}
.stage .sub{color:var(--muted);font-size:1.1rem;margin:0 0 22px}
.body{flex:1}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.btn{
  font:inherit;font-weight:500;font-size:1.05rem;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;
  background:var(--ink);color:#fff;transition:transform .1s,opacity .15s;
}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:#eef2f8;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* Orte */
.orte{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.ort-card.ph{padding:0;overflow:hidden;gap:0;text-align:left;align-items:stretch}
.ort-card.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ort-card.ph .lab{padding:11px 14px;display:flex;align-items:center;gap:8px}
.ort-card.ph.sel .lab{color:var(--ort)}
.ort-card.ph.sel .lab::after{content:'✓';margin-left:auto;font-weight:600}
.ort-card{
  border:2px solid var(--line);border-radius:20px;padding:18px 14px;background:#fff;text-align:center;
  display:flex;flex-direction:column;gap:10px;align-items:center;font:inherit;color:inherit;
}
button.ort-card{cursor:pointer;transition:border-color .15s,transform .1s,background .15s}
button.ort-card:hover,.ort-card .vb:hover{border-color:var(--ort);transform:translateY(-2px)}
.ort-card.sel{border-color:var(--ort);background:#f1edff}
.ort-card .ic{font-size:2.4rem;line-height:1}
.ort-card .lab{font-weight:500;font-size:1.1rem}
.vb{
  font:inherit;font-weight:500;border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 12px;cursor:pointer;width:100%;color:var(--ink)
}
.vb.sel{border-color:var(--ort);background:#f1edff;color:var(--ort)}

/* Entscheidung */
.choices{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0}
.choice{
  font:inherit;font-weight:500;font-size:1.3rem;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 22px;cursor:pointer;color:var(--ink);
  transition:border-color .15s,background .15s,transform .1s;
}
.choice:hover:not(:disabled){border-color:#9fb3d6;transform:translateY(-1px)}
.choice.right{border-color:var(--ok);background:#e9f8f0;color:#137a49}
.choice.wrong{border-color:var(--no);background:#fdecef;color:var(--no)}
.choice:disabled{cursor:default}
.msg{min-height:30px;margin-top:12px;font-size:1.1rem;font-weight:500}
.msg.ok{color:var(--ok)} .msg.no{color:var(--no)}
.rule{
  background:#f6f8fc;border-radius:16px;padding:14px 18px;font-size:1.1rem;margin-top:14px;border-left:6px solid var(--verb)
}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--verb);color:#fff;font-size:.9rem;margin-right:6px}

/* Tabelle */
table{border-collapse:separate;border-spacing:0 8px;width:100%;font-size:1.15rem}
th{text-align:left;color:var(--muted);font-weight:400;font-size:.95rem;padding:0 12px;line-height:1.7;vertical-align:bottom}
.case{display:inline-block;font-weight:600;font-size:1rem;border-radius:8px;padding:1px 10px}
.case.nom{background:#e9edf5;color:var(--slate)}
.case.akk{background:#e8f8fa;color:var(--obj)}
td{padding:10px 12px;background:#f6f8fc}
td:first-child{border-radius:12px 0 0 12px} td:last-child{border-radius:0 12px 12px 0}
.a{font-weight:600}
.a.der{color:var(--der)} .a.die{color:var(--die)} .a.das{color:var(--das)}
.hl{background:#fff4cf;border-radius:8px;padding:2px 8px;font-weight:600}

/* Wörter */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:6px 0 4px}
.word{
  border:2px solid var(--line);border-radius:16px;background:#fff;padding:14px 10px;cursor:pointer;font:inherit;color:var(--ink);
  display:flex;gap:7px;justify-content:center;align-items:center;font-size:1.15rem;font-weight:500;transition:border-color .15s,transform .1s;
}
.word:hover{border-color:#9fb3d6;transform:translateY(-1px)}
.word.sel{border-color:var(--obj);background:#e8f8fa}
.art{color:#fff;border-radius:8px;padding:1px 9px;font-size:1rem}
.art.der{background:var(--der)} .art.die{background:var(--die)} .art.das{background:var(--das)}
.more{background:none;border:0;font:inherit;color:var(--der);cursor:pointer;padding:8px 0;font-weight:500}
.prompt{font-size:1.5rem;margin:18px 0 6px;font-weight:500}
.prompt .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--obj);text-align:center;color:var(--obj)}

.final{font-size:2.1rem;font-weight:500;line-height:1.5;margin:6px 0 18px}
.final .o{color:var(--ort)} .final .v{color:var(--verb)} .final .x{color:var(--obj)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:1rem;margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.exrow{display:flex;flex-wrap:wrap;gap:10px 8px;margin:18px 0 6px}

@media (max-width:560px){
  .stage{padding:22px 16px}
  .stage h1{font-size:1.6rem}
  .chip{font-size:1.05rem;padding:5px 9px}
  .stripwrap{flex-direction:column}
  .final{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Einen Satz bauen · Kleidung</div>
    <div class="tools">
      <button class="tool" id="tVoice" aria-pressed="true" aria-label="Stimme: an" title="Stimme an/aus">

  <main class="stage" id="stage"></main>

</div>

const byName = n => ITEMS.find(i=>i.n===n);
const affForm = i => i.pl ? '' : ({der:'einen',das:'ein',die:'eine'})[i.art];
const negForm = i => i.pl ? 'keine' : ({der:'keinen',das:'kein',die:'keine'})[i.art];
const affPhrase = i => (affForm(i)? affForm(i)+' ' : '') + i.n;
const negPhrase = i => negForm(i)+' '+i.n;

/* ---------- Zustand ---------- */
const TOTAL = 8;
let step = 0;
let st;
function reset(){ st = {ort:null, placeKey:null, verb:false, adv:null, advDone:false, pick1:null, f1:false, pick2:null, f2:false, more:false, msg:null, check:null}; }
reset();

/* ---------- Audio ---------- */
let voiceOn = true, fxOn = true, ctx = null;
try{ const v = localStorage.getItem('sb_voice'), f = localStorage.getItem('sb_fx'); if(v==='0') voiceOn=false; if(f==='0') fxOn=false; }catch(e){}
function ac(){ if(!ctx){ const C = window.AudioContext||window.webkitAudioContext; if(C) ctx = new C(); } if(ctx && ctx.state==='suspended') ctx.resume(); return ctx; }
function tone(f,d,type,delay,vol){
  const c = ac(); if(!c) return;
  const t = c.currentTime + (delay||0), o = c.createOscillator(), g = c.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.05);
}
const fx = {
  click(){ if(!fxOn) return; tone(520,.07,'triangle',0,.12); },
  good(){ if(!fxOn) return; tone(660,.14,'sine',0,.18); tone(880,.22,'sine',.12,.18); },
  bad(){ if(!fxOn) return; tone(190,.22,'sawtooth',0,.09); tone(150,.26,'sawtooth',.12,.09); },
  win(){ if(!fxOn) return; [523,659,784,1047].forEach((f,k)=>tone(f,.28,'triangle',k*.13,.17)); }
};
let deVoice = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  deVoice = vs.find(v=>/^de(-|_)DE/i.test(v.lang)) || vs.find(v=>/^de/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE'; u.rate = 0.85; if(deVoice) u.voice = deVoice;
  speechSynthesis.speak(u);
}
function setTool(btn, on, name){
  btn.setAttribute('aria-pressed', String(on));
  btn.setAttribute('aria-label', name+': '+(on?'an':'aus'));
}
const tV = document.getElementById('tVoice'), tF = document.getElementById('tFx');
setTool(tV, voiceOn, 'Stimme'); setTool(tF, fxOn, 'Effekte');
tV.onclick = ()=>{ voiceOn=!voiceOn; setTool(tV,voiceOn,'Stimme'); if(!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel(); try{localStorage.setItem('sb_voice',voiceOn?'1':'0')}catch(e){} if(voiceOn) say('Stimme an'); };
tF.onclick = ()=>{ fxOn=!fxOn; setTool(tF,fxOn,'Effekte'); try{localStorage.setItem('sb_fx',fxOn?'1':'0')}catch(e){} if(fxOn) fx.good(); };

/* ---------- Satz ---------- */
function complete(){ return st.f1 && st.f2; }
function sentence(){
  const i1 = st.pick1 && byName(st.pick1), i2 = st.pick2 && byName(st.pick2);
  let s = st.ort+' trage ich ';
  if(st.adv) s += st.adv+' ';
  s += affPhrase(i1)+', aber '+negPhrase(i2)+'.';
  return s;
}
function chip(t,cls,pos,go){ return '<div class="cw"><span class="chip '+cls+'"'+(go!==undefined?' data-go="'+go+'" role="button" tabindex="0"':'')+'>'+t+'</span><span class="pos">'+(pos||'&nbsp;')+'</span></div>'; }
function renderStrip(){
  let h = '';
  const i1 = st.pick1 && byName(st.pick1), i2 = st.pick2 && byName(st.pick2);
  if(st.ort) h += chip(st.ort,'ort','Position 1',1);
  if(st.verb){ h += chip('trage','verb','Position 2',2); h += chip('ich','sub'); }
  if(st.advDone && st.adv) h += chip(st.adv,'sub',null,4);
  if(st.f1) h += chip(affPhrase(i1)+(st.f2?',':''),'obj',null,5);
  if(st.f1 && st.f2) { h += chip('aber','sub'); h += chip(negPhrase(i2)+'.','obj',null,6); }
  if(!complete()) h += chip('…','gap');
  if(!st.ort) h = chip('…','gap');
  document.getElementById('strip').innerHTML = h;
  document.getElementById('hear').disabled = !complete();
}
document.getElementById('hear').onclick = ()=>{ if(complete()) say(sentence()); };

function maxStep(){
  if(!st.ort) return 1;
  if(!st.verb) return 2;
  if(!st.f1) return 5;
  if(!st.f2) return 6;
  return 7;
}
function renderDots(){
  const m = maxStep(); let h='';
  for(let k=0;k<TOTAL;k++){
    const open = k<=m && k!==step;
    h += '<button class="dot '+(k<step?'done':k===step?'now':'')+(open?' open':'')+'" '+(open?'data-go="'+k+'"':'disabled')+' aria-label="Folie '+(k+1)+'"></button>';
  }
  const d=document.getElementById('dots'); d.innerHTML = h;
}
document.getElementById('dots').addEventListener('click', e=>{ const b=e.target.closest('[data-go]'); if(b){ fx.click(); go(+b.dataset.go); } });
document.getElementById('strip').addEventListener('click', e=>{ const b=e.target.closest('[data-go]'); if(b){ fx.click(); go(+b.dataset.go); } });
document.getElementById('strip').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ const b=e.target.closest('[data-go]'); if(b){ e.preventDefault(); go(+b.dataset.go); } } });

/* ---------- Folien ---------- */
function msgHtml(){ return '<div class="msg '+(st.msg?(st.msg.ok?'ok':'no'):'')+'" role="status">'+(st.msg?st.msg.t:'')+'</div>'; }

function slide0(){
  return {
    title:'Einen Satz bauen',
    sub:'So sieht dein Satz am Ende aus:',
    body:`<div class="exrow">
      <div class="cw"><span class="chip ort">Bei der Arbeit</span><span class="pos">Position 1</span></div>
      <div class="cw"><span class="chip verb">trage</span><span class="pos">Position 2</span></div>
      <div class="cw"><span class="chip sub">ich</span><span class="pos">&nbsp;</span></div>
      <div class="cw"><span class="chip sub">meistens</span><span class="pos">&nbsp;</span></div>
      <div class="cw"><span class="chip obj">einen Anzug,</span><span class="pos">&nbsp;</span></div>
      <div class="cw"><span class="chip sub">aber</span><span class="pos">&nbsp;</span></div>
      <div class="cw"><span class="chip obj">keine Krawatte.</span><span class="pos">&nbsp;</span></div>
    </div>
    <div class="rule"><span class="num">1</span>Ort &nbsp; <span class="num">2</span>Verb &nbsp; + Akkusativ</div>
    <p class="sub" style="margin-top:18px">Baue Schritt für Schritt deinen eigenen Satz.</p>`,
    next:'Los geht’s', canNext:true
  };
}
function slide1(){
  const cards = PLACES.map(p=>{
    const sel = st.ort===p.v;
    return `<button class="ort-card ph ${sel?'sel':''}" data-act="ort" data-key="${p.key}" data-v="${p.v}"><img src="${IMG[p.key]}" alt="${p.label}"><span class="lab">${p.label}</span></button>`;
  }).join('');
  return {title:'Wo bist du?', sub:'Position 1: Wähle einen Ort.', body:`<div class="orte">${cards}</div>`, canNext:!!st.ort};
}
function slide2(){
  const done = st.verb;
  const o = st.ort;
  const opt = (txt,right)=>`<button class="choice ${done&&right?'right':''}" data-act="verb" data-right="${right?1:0}" ${done?'disabled':''}>${o} <b>${txt}</b> …</button>`;
  return {
    title:'Wo steht das Verb?',
    sub:'Das Verb steht immer auf Position 2.',
    body:`<div class="choices" style="flex-direction:column;align-items:flex-start">${opt('trage ich',true)}${opt('ich trage',false)}</div>${msgHtml()}
    ${done?`<div class="rule"><span class="num">2</span> tragen → <b>ich trage</b></div>`:''}`,
    canNext:done
  };
}
function slide3(){
  const ch = st.check;
  const o = (f)=>`<button class="choice ${ch&&ch.picked===f?(ch.ok?'right':'wrong'):''}" data-act="check" data-f="${f}" ${ch&&ch.ok?'disabled':''}>${f}</button>`;
  return {
    title:'Kurz wiederholen: Akkusativ',
    sub:'Das Verb tragen braucht den Akkusativ.',
    body:`<table>
      <tr><th><span class="case nom">Nominativ</span><br>bestimmter Artikel</th><th><span class="case akk">Akkusativ</span><br>Ich trage …</th><th><span class="case akk">Akkusativ</span><br>Ich trage … nicht</th></tr>
      <tr><td><span class="a der">der</span> Anzug</td><td><span class="hl">einen</span> Anzug</td><td><span class="hl">keinen</span> Anzug</td></tr>
      <tr><td><span class="a das">das</span> Kleid</td><td>ein Kleid</td><td>kein Kleid</td></tr>
      <tr><td><span class="a die">die</span> Hose</td><td>eine Hose</td><td>keine Hose</td></tr>
      <tr><td><span class="a die">die</span> Schuhe</td><td>– Schuhe</td><td>keine Schuhe</td></tr>
    </table>
    <div class="prompt">Ich trage <span class="blank">${ch&&ch.ok?'einen':'&nbsp;'}</span> Pullover.</div>
    <div class="choices">${o('ein')}${o('einen')}${o('eine')}</div>${msgHtml()}`,
    canNext:true
  };
}
function slide4(){
  const b = ADVS.map(a=>`<button class="choice ${st.adv===a?'right':''}" data-act="adv" data-a="${a}">${a}</button>`).join('');
  return {
    title:'Wie oft?',
    sub:'Optional: Das Wort steht nach „ich“.',
    body:`<div class="choices">${b}<button class="choice" data-act="adv" data-a="">ohne</button></div>`,
    canNext:true
  };
}
function wordList(exclude){
  const names = st.more ? ITEMS.map(i=>i.n) : SUGGEST[st.placeKey];
  return names.filter(n=>n!==exclude).map(n=>byName(n));
}
function wordGrid(selName, exclude){
  const list = wordList(exclude);
  return `<div class="words">`+list.map(i=>`<button class="word ${selName===i.n?'sel':''}" data-act="pick" data-n="${i.n}"><span class="art ${i.art}">${i.art}</span>${i.n}</button>`).join('')+`</div>
  <button class="more" data-act="more">${st.more?'Weniger Wörter':'Mehr Wörter'}</button>`;
}
function slide5(){
  const i = st.pick1 && byName(st.pick1);
  let forms = '';
  if(i){
    const opts = ['einen','ein','eine','–'];
    forms = `<div class="prompt">Ich trage <span class="blank">${st.f1?(affForm(i)||'–'):'&nbsp;'}</span> ${i.n}.</div>
    <div class="choices">`+opts.map(f=>{
      const right = (f==='–'?'':f)===affForm(i);
      return `<button class="choice ${st.f1&&right?'right':''}" data-act="form1" data-right="${right?1:0}" ${st.f1?'disabled':''}>${f}</button>`;
    }).join('')+`</div>${msgHtml()}`;
  }
  return {
    title:'Was trägst du?',
    sub:'Wähle ein Wort.',
    body:(st.f1?'':wordGrid(st.pick1,null))+(st.f1?`<div class="words"><div class="word sel"><span class="art ${i.art}">${i.art}</span>${i.n}</div></div><button class="more" data-act="redo1">Anderes Wort</button>`:'')+forms,
    canNext:st.f1
  };
}
function slide6(){
  const i = st.pick2 && byName(st.pick2);
  let forms = '';
  if(i){
    const opts = ['keinen','kein','keine'];
    forms = `<div class="prompt">Ich trage <span class="blank">${st.f2?negForm(i):'&nbsp;'}</span> ${i.n}.</div>
    <div class="choices">`+opts.map(f=>{
      const right = f===negForm(i);
      return `<button class="choice ${st.f2&&right?'right':''}" data-act="form2" data-right="${right?1:0}" ${st.f2?'disabled':''}>${f}</button>`;
    }).join('')+`</div>${msgHtml()}`;
  }
  return {
    title:'Und was trägst du nicht?',
    sub:'aber + kein …',
    body:(st.f2?'':wordGrid(st.pick2,st.pick1))+(st.f2?`<div class="words"><div class="word sel"><span class="art ${i.art}">${i.art}</span>${i.n}</div></div><button class="more" data-act="redo2">Anderes Wort</button>`:'')+forms,
    canNext:st.f2
  };
}
function slide7(){
  const i1 = byName(st.pick1), i2 = byName(st.pick2);
  return {
    title:'Super! Dein Satz ist fertig.',
    sub:'',
    body:`<div class="final"><span class="o">${st.ort}</span> <span class="v">trage</span> ich ${st.adv?st.adv+' ':''}<span class="x">${affPhrase(i1)}</span>, aber <span class="x">${negPhrase(i2)}</span>.</div>
    <div class="legend"><span><i style="background:var(--ort)"></i>Position 1</span><span><i style="background:var(--verb)"></i>Position 2: Verb</span><span><i style="background:var(--obj)"></i>Akkusativ</span></div>
    <div class="choices" style="margin-top:18px">
      <button class="btn" data-act="say">Satz anhören</button>
      <button class="btn ghost" data-act="again">Neuer Satz</button>
    </div>`,
    next:null, canNext:false
  };
}
const SLIDES = [slide0,slide1,slide2,slide3,slide4,slide5,slide6,slide7];

/* ---------- Render ---------- */
function render(dir){
  const s = SLIDES[step]();
  const nextLabel = s.next===undefined ? 'Weiter' : s.next;
  document.getElementById('stage').innerHTML =
    `<h1>${s.title}</h1>${s.sub?`<p class="sub">${s.sub}</p>`:'<div style="height:12px"></div>'}
     <div class="body">${s.body}</div>
     <div class="nav">
       <button class="btn ghost" data-act="back" ${step===0?'style="visibility:hidden"':''}>Zurück</button>
       ${nextLabel?`<button class="btn" data-act="next" ${s.canNext?'':'disabled'}>${nextLabel}</button>`:'<span></span>'}
     </div>`;
  renderDots(); renderStrip();
  if(dir){ const el=document.getElementById('stage'); el.classList.remove('in-r','in-l'); void el.offsetWidth; el.classList.add(dir>0?'in-r':'in-l'); }
}
function go(n){
  if(n<0||n>TOTAL-1||n>maxStep()||n===step) return;
  const dir = n>step?1:-1; step=n; st.msg=null; render(dir);
  if(n===7){ fx.win(); setTimeout(()=>say(sentence()),700); }
  window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('[data-go]')) return;
  if(e.key==='ArrowRight') go(step+1);
  if(e.key==='ArrowLeft') go(step-1);
});
let tx=null,ty=null;
document.getElementById('stage').addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
document.getElementById('stage').addEventListener('touchend',e=>{
  if(tx===null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.6){ dx<0?go(step+1):go(step-1); }
},{passive:true});

document.getElementById('stage').addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a = b.dataset.act;
  if(a==='next'){ fx.click(); go(step+1); return; }
  if(a==='back'){ fx.click(); go(step-1); return; }
  if(a==='ort'){
    fx.click(); st.ort = b.dataset.v; st.placeKey = b.dataset.key;
    say(st.ort); render(); return;
  }
  if(a==='verb'){
    if(b.dataset.right==='1'){ st.verb=true; st.msg={ok:true,t:'Richtig! Das Verb steht auf Position 2.'}; fx.good(); say(st.ort+' trage ich'); }
    else { st.msg={ok:false,t:'Nicht ganz. Das Verb steht auf Position 2.'}; fx.bad(); }
    render(); return;
  }
  if(a==='check'){
    const ok = b.dataset.f==='einen';
    st.check = {picked:b.dataset.f, ok};
    st.msg = ok ? {ok:true,t:'Richtig! der Pullover → einen Pullover'} : {ok:false,t:'Nicht ganz. Maskulin im Akkusativ: einen.'};
    ok?fx.good():fx.bad(); if(ok) say('Ich trage einen Pullover.');
    render(); return;
  }
  if(a==='adv'){ fx.click(); st.adv = b.dataset.a||null; st.advDone = true; if(st.adv) say(st.adv); render(); return; }
  if(a==='more'){ fx.click(); st.more=!st.more; render(); return; }
  if(a==='pick'){
    fx.click(); st.msg=null;
    const i = byName(b.dataset.n); say(i.art+' '+i.n);
    if(step===5){ st.pick1=i.n; if(st.pick2===i.n){ st.pick2=null; st.f2=false; } } else st.pick2=i.n;
    render(); return;
  }
  if(a==='form1'||a==='form2'){
    const i = byName(a==='form1'?st.pick1:st.pick2);
    if(b.dataset.right==='1'){
      if(a==='form1'){ st.f1=true; st.msg={ok:true,t:'Richtig! '+affPhrase(i)}; say('Ich trage '+affPhrase(i)); }
      else { st.f2=true; st.msg={ok:true,t:'Richtig! '+negPhrase(i)}; say('Aber '+negPhrase(i)); }
      fx.good();
    } else { st.msg={ok:false,t:'Nicht ganz. '+i.art+' '+i.n+(i.pl?' (Plural)':'')+' – versuche es noch einmal.'}; fx.bad(); }
    render(); return;
  }
  if(a==='redo1'){ fx.click(); st.pick1=null; st.f1=false; st.msg=null; render(); return; }
  if(a==='redo2'){ fx.click(); st.pick2=null; st.f2=false; st.msg=null; render(); return; }
  if(a==='say'){ say(sentence()); return; }
  if(a==='again'){ fx.click(); reset(); step=1; render(-1); window.scrollTo({top:0,behavior:'smooth'}); return; }
});

render();
</script>
</body>
</html>
